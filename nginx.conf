server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The CSS filename is intentionally stable so Clarity can replay sessions
    # recorded before the latest deployment. Revalidate it for live visitors.
    location = /assets/app.css {
        expires off;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /assets/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /fonts/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
